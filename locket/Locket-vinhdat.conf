[General]
loglevel = notify

[Rule]
FINAL,DIRECT

[Script]
revenuecat = type=http-response, pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^/]+$), script-path=https://raw.githubusercontent.com/vdatdv/vinhdat-Modules/main/locket/scripts/locketfix8.js, requires-body=true, max-size=-1, timeout=60
deleteHeader = type=http-request, pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers), script-path=https://raw.githubusercontent.com/vdatdv/vinhdat-Modules/main/locket/scripts/header7.js, timeout=60
locket_rc = type=http-response, pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+, script-path=https://raw.githubusercontent.com/vdatdv/vinhdat-Modules/main/locket/scripts/forceGold4.3.js, requires-body=true, max-size=-1, timeout=60

[MITM]
hostname = api.revenuecat.com, firebaseremoteconfig.googleapis.com
